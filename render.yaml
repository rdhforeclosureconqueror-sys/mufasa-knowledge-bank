services:
  - type: web
    name: MufasaKnowledgeBank
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENVOICE_URL
        value: https://ffmpeg-9xhs.onrender.com
      - key: PYTHON_VERSION
        value: 3.11
